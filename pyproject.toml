[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeako-community"
version = "0.6.1"
authors = [
  { name="Deako", email="software@deako.com" },
  { name="pydeako-community contributors" },
]
maintainers = [
  { name="iulianmac" },
]
description = "Connect and interact with deako devices over the network locally"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
dependencies = [
    "zeroconf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/pydeako-community/pydeako"
"Source" = "https://github.com/pydeako-community/pydeako"
"Bug Tracker" = "https://github.com/pydeako-community/pydeako/issues"
"Changelog" = "https://github.com/pydeako-community/pydeako/releases"

[tool.setuptools.packages.find]
include = ["pydeako*"]

[tool.setuptools.package-data]
pydeako = ["py.typed"]
