[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeako-community"
version = "0.6.1"
authors = [
  { name="Deako", email="software@deako.com" },
  { name="pydeako-community contributors" },
]
maintainers = [
  { name="iulianmac" },
]
description = "Connect and interact with deako devices over the network locally"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
dependencies = [
    "zeroconf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/pydeako-community/pydeako"
"Source" = "https://github.com/pydeako-community/pydeako"
"Bug Tracker" = "https://github.com/pydeako-community/pydeako/issues"
"Changelog" = "https://github.com/pydeako-community/pydeako/releases"

[tool.setuptools.packages.find]
include = ["pydeako*"]

[tool.setuptools.package-data]
pydeako = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# Test bodies are still type checked, but test functions need no annotations.
module = [
    "pydeako.deako.test_deako",
    "pydeako.deako.test_manager",
    "pydeako.deako.utils.test_connection",
    "pydeako.deako.utils.test_socket",
    "pydeako.discover.test_address_pool",
    "pydeako.discover.test_discover",
    "pydeako.models.test_request",
    "pydeako.test_integration",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
